  <text x="212" y="82" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.45)">Web · CRM · ERP · School Software — Sahibganj, Jharkhand</text>

  <!-- Badges -->
  <rect x="212" y="96" width="82" height="22" rx="11" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="253" y="111" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)" text-anchor="middle">200+ Clients</text>

