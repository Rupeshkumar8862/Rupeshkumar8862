<svg width="900" height="180" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="55%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <radialGradient id="glow1" cx="88%" cy="15%" r="32%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.22"/>
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="35%" cy="95%" r="28%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <clipPath id="rc">
      <rect width="900" height="180" rx="14"/>
    </clipPath>
  </defs>

  <!-- BG -->
  <rect width="900" height="180" rx="14" fill="url(#bg)"/>
  <rect width="900" height="180" rx="14" fill="url(#glow1)" clip-path="url(#rc)"/>
  <rect width="900" height="180" rx="14" fill="url(#glow2)" clip-path="url(#rc)"/>

  <!-- Decorative circle top-right -->
  <circle cx="860" cy="30" r="55" fill="none" stroke="rgba(99,102,241,0.12)" stroke-width="1.5"/>
