  <text x="766" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#fde68a" text-anchor="middle">Linux</text>

  <!-- Postman -->
  <rect x="802" y="152" width="70" height="22" rx="11" fill="#ef4444" fill-opacity="0.18" stroke="#f87171" stroke-width="1" stroke-opacity="0.5"/>
  <text x="837" y="167" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#fca5a5" text-anchor="middle">Postman</text>

