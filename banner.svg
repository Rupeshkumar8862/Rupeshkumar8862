  <!-- TO REPLACE: delete the 3 lines below and uncomment the <image> line -->
  <rect x="28" y="32" width="148" height="80" rx="10" fill="#f8fafc"/>
  <text x="102" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="url(#logoGrad)" text-anchor="middle" letter-spacing="-1">RT</text>
  <text x="102" y="90" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="1.5">RUPESH TECH</text>
  <!-- <image href="./logo.png" x="32" y="36" width="140" height="72"/> -->

