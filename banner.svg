  <text x="762" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.38)" text-anchor="middle">Clients</text>

  <text x="852" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#60a5fa" text-anchor="middle">10+</text>
  <text x="852" y="74" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="rgba(255,255,255,0.38)" text-anchor="middle">Years</text>

